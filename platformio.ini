; =============================================================================
; Animotion — Root PlatformIO Configuration
; Builds the firmware example directly from the repository root.
; =============================================================================

[platformio]
default_envs = esp32dev
src_dir = examples/esp32c3-ssd1306/src

; Standard ESP32 DevKit (ESP-WROOM-32 / 30-pin / 38-pin)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    Wire
build_flags =
    -Iengine/include

; ESP32-C3 SuperMini / DevKitM-1
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    Wire
build_flags =
    -Iengine/include
