; =============================================================================
; Animotion v0.1 — PlatformIO Configuration for ESP32-C3 SuperMini + SSD1306
; =============================================================================

[platformio]
default_envs = esp32dev

; Standard ESP32 DevKit (ESP-WROOM-32 / 30-pin / 38-pin)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    Wire
build_flags =
    -I../../engine/include

; ESP32-C3 SuperMini / DevKitM-1
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Dependencies for I2C monochrome OLED display
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    Wire

; Include the Animotion engine header
build_flags =
    -I../../engine/include
